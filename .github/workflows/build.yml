
name: compare-package-manager-timings

on:
  workflow_dispatch:

jobs:
  compare:
    strategy:
      matrix:
        os: [windows-11-arm]

    runs-on: ${{ matrix.os }}

    steps:
      # -----------------------------
      # NuGet PCRE2 Timing
      # -----------------------------
      - name: Measure NuGet PCRE2 install time
        shell: powershell
        run: |
          $start = Get-Date

          nuget install PCRE2 -OutputDirectory C:\Tools\NuGet

          $elapsed = ((Get-Date) - $start).TotalSeconds
          Write-Host "NuGet PCRE2 install took $elapsed seconds"

      # -----------------------------
      # NuGet Boost Timing
      # -----------------------------
      - name: Measure NuGet Boost install time
        shell: powershell
        run: |
          $start = Get-Date

          nuget install boost -OutputDirectory C:\Tools\NuGet

          $elapsed = ((Get-Date) - $start).TotalSeconds
          Write-Host "NuGet Boost install took $elapsed seconds"

      # -----------------------------
      # vcpkg Timing
      # ----------------------------

      - name: Measure vcpkg PCRE2 install time
        shell: cmd
        run: |

          $start = Get-Date

          vcpkg install pcre2:x64-windows-static

          $elapsed = ((Get-Date) - $start).TotalSeconds
          Write-Host "vcpkg PCRE2 install took $elapsed seconds"

