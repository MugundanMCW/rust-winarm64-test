name: Verify PyArrow ARM64 Wheel SIMD Support

on:
  workflow_dispatch:

jobs:
  verify-simd:
    name: Verify xsimd / SIMD in pyarrow wheel
    runs-on: windows-11-arm

    steps:
      - name: Download wheel from release
        shell: pwsh
        run: |
          $url = "https://github.com/MugundanMCW/crossbow/releases/download/build-62-github-wheel-windows-cp313-cp313t-arm64/pyarrow-18.0.0-cp313-cp313t-win_arm64.whl"
          New-Item -ItemType Directory -Force -Path wheels | Out-Null
          Invoke-WebRequest -Uri $url -OutFile "wheels\pyarrow-18.0.0-cp313-cp313t-win_arm64.whl"
          Write-Host "Downloaded: $(Get-ChildItem wheels\*.whl)"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13t"
          architecture: "arm64"

      - name: Install wheel
        shell: pwsh
        run: |
          $whl = Get-ChildItem wheels\*.whl | Select-Object -First 1
          Write-Host "Installing: $($whl.FullName)"
          pip install $whl.FullName numpy

      - name: Check SIMD / xsimd support
        shell: python
        run: |
          import pyarrow as pa
          import os
      
          print("=== Runtime SIMD Info ===")
          print(pa.runtime_info())
      
          include_dir = pa.get_include()
          config_h = os.path.join(include_dir, "arrow", "util", "config.h")
      
          print(f"\nChecking config file: {config_h}")
      
          if os.path.exists(config_h):
              with open(config_h, "r", encoding="utf-8") as f:
                  content = f.read()
      
              if "#define ARROW_USE_XSIMD 1" in content:
                  print("xsimd support ENABLED")
              elif "#define ARROW_USE_XSIMD 0" in content:
                  print("xsimd support DISABLED")
              else:
                  print("ARROW_USE_XSIMD flag not found")
          else:
              print("config.h not found")
