name: Verify PyArrow ARM64 Wheel SIMD Support

on:
  workflow_dispatch:
    inputs:
      wheel_url:
        description: "Direct URL to the .whl release asset"
        required: true
        type: string

jobs:
  verify-simd:
    name: Verify xsimd / SIMD in pyarrow wheel
    runs-on: windows-11-arm

    steps:
      - name: Download wheel from release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path wheels | Out-Null
          Invoke-WebRequest -Uri "${{ inputs.wheel_url }}" -OutFile "wheels\wheel.whl"
          Write-Host "Downloaded: $(Get-ChildItem wheels\*.whl)"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13t"
          architecture: "arm64"

      - name: Install wheel
        shell: pwsh
        run: |
          $whl = Get-ChildItem wheels\*.whl | Select-Object -First 1
          Write-Host "Installing: $($whl.FullName)"
          pip install $whl.FullName numpy

      - name: Check SIMD support reported by PyArrow
        shell: python
        run: |
          import pyarrow as pa
          import sys

          print("=" * 60)
          print(f"PyArrow version  : {pa.__version__}")
          print(f"Arrow C++ version: {pa.cpp_build_info.version}")
          print("-" * 60)

          # pa.runtime_info() is the correct API across all Arrow versions.
          # It returns a struct with simd_level and runtime_simd_level.
          info = pa.runtime_info()
          simd    = info.simd_level
          rt_simd = info.runtime_simd_level

          print(f"Compile-time SIMD level : {simd}")
          print(f"Runtime SIMD level      : {rt_simd}")
          print("-" * 60)
          print("Full runtime info:")
          print(info)
          print("=" * 60)

          # On ARM64 Windows we expect NEON at minimum
          if simd.upper() == "NONE":
              print("ERROR: SIMD is NONE — xsimd was not compiled in!")
              sys.exit(1)

          print(f"PASS: SIMD is enabled ({simd}), xsimd is active in this wheel.")

      - name: Run compute workload (NEON smoke test)
        shell: python
        run: |
          import pyarrow as pa
          import pyarrow.compute as pc
          import numpy as np

          print("Running SIMD-accelerated compute operations...")

          # Float64 aggregations exercise NEON vectorisation via xsimd
          arr = pa.array(np.random.rand(5_000_000), type=pa.float64())
          print(f"  sum  = {pc.sum(arr).as_py():.6f}")
          print(f"  mean = {pc.mean(arr).as_py():.6f}")
          print(f"  min  = {pc.min(arr).as_py():.6f}")
          print(f"  max  = {pc.max(arr).as_py():.6f}")

          # String kernel also uses xsimd on ARM64
          strs = pa.array(["hello", "world", "arrow", "neon"] * 1_000_000)
          lengths = pc.utf8_length(strs)
          print(f"  utf8_length sum = {pc.sum(lengths).as_py()}")

          print("PASS: all compute operations completed successfully.")

      - name: Inspect DLL exports for SIMD symbols
        shell: pwsh
        run: |
          $arrowDll = Get-ChildItem -Recurse -Filter "arrow.dll" |
                      Select-Object -First 1 -ExpandProperty FullName
          if (-not $arrowDll) {
              Write-Host "arrow.dll not found, skipping symbol check."
              exit 0
          }
          Write-Host "Inspecting: $arrowDll"
          $exports = dumpbin /EXPORTS $arrowDll 2>&1
          $simdHits = $exports | Select-String -Pattern "neon|simd|xsimd" -CaseSensitive:$false
          if ($simdHits) {
              Write-Host "Found SIMD-related exports:"
              $simdHits | ForEach-Object { Write-Host "  $_" }
          } else {
              Write-Host "No SIMD symbols in exports (expected — xsimd is header-only/inlined)."
          }
