name: compare-package-manager-timings

on:
  workflow_dispatch:

jobs:
  compare:
    strategy:
      matrix:
        os: [windows-2025]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------
      # NuGet Timing
      # -----------------------------
      - name: Measure NuGet install time
        shell: powershell
        run: |
          $start = Get-Date

          nuget install PCRE2 -OutputDirectory C:\Tools\NuGet
          nuget install boost -OutputDirectory C:\Tools\NuGet

          $end = Get-Date
          $elapsed = ($end - $start).TotalSeconds

          Write-Host "NuGet install took $elapsed seconds"

      # -----------------------------
      # vcpkg Timing
      # -----------------------------
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Measure vcpkg install time
        shell: powershell
        run: |
          $triplet = if ("${{ matrix.os }}" -eq "windows-11-arm") {
            "arm64-windows-static"
          } else {
            "x64-windows-static"
          }

          $start = Get-Date

          vcpkg install pcre2:$triplet boost:$triplet

          $end = Get-Date
          $elapsed = ($end - $start).TotalSeconds

          Write-Host "vcpkg install took $elapsed seconds"
