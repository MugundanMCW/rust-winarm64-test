name: Windows ARM64 MSVC Test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-11-arm   # or windows-latest if using x64 runner for cross compile

    steps:
      - uses: actions/checkout@v4

      # Setup MSVC Developer Command Prompt for ARM64
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      # Verify the environment really targets ARM64
      - name: Verify ARM64 Toolchain
        shell: cmd
        run: |
          echo VSCMD_ARG_TGT_ARCH=%VSCMD_ARG_TGT_ARCH%
          cl
          echo int main(){} > test.cpp
          cl /c test.cpp
          dumpbin /headers test.obj | findstr machine

      # Configure project
      - name: Configure
        run: |
          cmake -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_C_COMPILER=cl ^
            -DCMAKE_CXX_COMPILER=cl ^
            -B build ^
            -S .

      # Build
      - name: Build
        run: cmake --build build --config Release
